name: Request prod deploy

# The test team asks for the version on the test tenant to go to production.
# Optional: only some journeys (by name); the external connections they use come with them. Empty: everything.
# 1. Works out what changes on the prod tenant, and checks that the test tenant already runs exactly that version
#    (what was tested is what is promoted).
# 2. Opens a pull request into the prod branch with what changes on the prod tenant. It is built from prod with only
#    the chosen journeys (plus the pipeline code: scripts/, terraform/), frozen at the tested commit; later merges
#    to main are not included.
# 3. Optional maintenance window: the "Prod maintenance window" workflow merges the pull request at that time.
# After the merge, HCP Terraform (transmit-prod follows the prod branch) plans: Confirm & apply.
on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Journeys to deploy, by name, comma separated (empty: all the changes on the test tenant)"
        required: false
        default: ""
      window:
        description: "Maintenance window, UTC, e.g. 2026-11-08 22:00 (empty: merge by hand)"
        required: false
        default: ""
      note:
        description: "Note for the approvers (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  request:
    runs-on: ubuntu-24.04
    environment: test-readonly
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: us
      TS_STAGE: test
      GH_TOKEN: ${{ github.token }}
      WINDOW: ${{ inputs.window }}
      JOURNEYS: ${{ inputs.journeys }}
      NOTE: ${{ inputs.note }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Check the maintenance window
        run: |
          python3 - <<'PY'
          import datetime, os, sys
          w = os.environ["WINDOW"].strip()
          if w:
              try:
                  t = datetime.datetime.strptime(w, "%Y-%m-%d %H:%M").replace(tzinfo=datetime.timezone.utc)
              except ValueError:
                  sys.exit(f"::error::Maintenance window '{w}': use YYYY-MM-DD HH:MM (UTC)")
              if t < datetime.datetime.now(datetime.timezone.utc):
                  sys.exit(f"::error::Maintenance window {w} UTC is in the past")
              open(os.environ["GITHUB_ENV"], "a").write(f"WINDOW_ISO={t.strftime('%Y-%m-%dT%H:%MZ')}\n")
          PY
      - name: Journeys to deploy
        run: |
          if [ -n "$(echo "$JOURNEYS" | tr -d ' ,')" ]; then
            FILES=$(python3 scripts/select_promotion.py "$JOURNEYS")
            echo "Promoting: $(echo $FILES)"
            echo "SELECTED=$(echo $FILES)" >> "$GITHUB_ENV"
          else
            echo "Promoting everything that changed on main"
          fi
      - name: Build the version for prod
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          MAIN=$(git rev-parse HEAD)
          echo "MAIN_SHA=$MAIN" >> "$GITHUB_ENV"
          git checkout -q -B promote origin/prod
          # pipeline code from main; the prod tenant's restore requests stay as they are on prod
          git checkout -q "$MAIN" -- .github scripts terraform README.md
          git checkout -q origin/prod -- terraform/restore 2>/dev/null || true
          if [ -n "${SELECTED:-}" ]; then
            for f in $SELECTED; do git checkout -q "$MAIN" -- "$f"; done
          else
            git rm -rq --ignore-unmatch journeys connections
            git checkout -q "$MAIN" -- journeys
            git ls-tree -d "$MAIN" connections | grep -q . && git checkout -q "$MAIN" -- connections
          fi
          git add -A
          git commit -q -m "Promote to prod: ${JOURNEYS:-all the changes} (tested at main ${MAIN:0:7})" || echo "nothing to commit"
      - name: What changes on the prod tenant
        run: |
          set +e
          CHANGED=$(python3 scripts/promotion.py origin/prod "$RUNNER_TEMP/changes.md" "$RUNNER_TEMP/paths.txt"); rc=$?
          set -e
          if [ $rc = 3 ]; then
            cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"; echo "Nothing to deploy."; exit 0
          fi
          [ $rc = 0 ] || exit $rc
          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"
      - name: Tested on the test tenant
        if: env.CHANGED != ''
        run: |
          # only what changes in production must already run on the test tenant (exactly this version)
          bash scripts/tsvm.sh export "$RUNNER_TEMP/test.zip"
          if ! DRIFT_ONLY="$(cat "$RUNNER_TEMP/paths.txt")" GITHUB_STEP_SUMMARY= python3 scripts/drift.py "$RUNNER_TEMP/test.zip"; then
            echo "::error title=Not tested yet::The test tenant does not run this version of: $CHANGED. Confirm & apply transmit-test first, then request the prod deploy again."
            exit 1
          fi
      - name: Open the pull request into prod
        if: env.CHANGED != ''
        run: |
          SHA=$MAIN_SHA
          BRANCH="promote/prod-${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          python3 - "$BRANCH" "$SHA" "${{ github.actor }}" "$RUNNER_TEMP/changes.md" > pr.json <<'PY'
          import json, os, sys, datetime
          branch, sha, actor, changes = sys.argv[1:]
          changed, window, wiso, note = (os.environ.get(k, "") for k in ("CHANGED", "WINDOW", "WINDOW_ISO", "NOTE"))
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          only = os.environ.get("JOURNEYS", "").strip(" ,")
          scope = (f"Only the journeys asked for: **{only}** (with the external connections they use). Other changes on "
                   "main stay on the test tenant.\n\n") if only else ""
          body = (f"**Prod deploy requested by @{actor}.**" + (f"\n\n> {note}" if note.strip() else "") + "\n\n"
                  + scope + f"Tested: the test tenant runs this version (main `{sha[:7]}`, checked {now}).\n\n"
                  + open(changes).read() + "\n")
          if wiso:
              body += (f"### Maintenance window: {window} UTC\n\n<!-- window: {wiso} -->\n"
                       "The *Prod maintenance window* workflow merges this pull request at that time (if the checks are "
                       "green). Then, in HCP Terraform, **Confirm & apply** on `transmit-prod`.\n")
          else:
              body += ("### Next steps\n\nMerge when ready, then in HCP Terraform **Confirm & apply** on "
                       "`transmit-prod`.\n")
          title = f"Deploy to prod: {changed}" + (f" (window {window} UTC)" if wiso else "")
          print(json.dumps({"title": title, "head": branch, "base": "prod", "body": body}))
          PY
          API="https://api.github.com/repos/${{ github.repository }}"
          URL=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/pulls" --data @pr.json \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["html_url"])')
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows: start the check explicitly
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/actions/workflows/pr.yml/dispatches" \
            -d "{\"ref\": \"$BRANCH\"}"
          {
            echo "### Prod deploy requested"
            echo
            echo "✅ Tested on the test tenant: $CHANGED"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            if [ -n "${WINDOW_ISO:-}" ]; then echo "**Maintenance window:** $WINDOW UTC (merged automatically)"; echo; fi
            echo "**Pull request:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request: $URL"
