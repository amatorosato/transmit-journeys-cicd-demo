name: Deploy

# Merge to main: deploy to dev (amato-rosato-sbx-demo), then after approval to test
# (telco-demo-tenant, US), then after a second approval to prod (Vodafone-CIAM-POC, EU).
# The same commit goes through every stage.
on:
  push:
    branches: [main]
    paths: ["journeys/**", "sub-journeys/**", "connections/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    with: { environment: dev, region: sbx }
    secrets: inherit
  test:
    needs: dev
    uses: ./.github/workflows/_deploy.yml
    with: { environment: test, region: us }
    secrets: inherit
  prod:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with: { environment: prod, region: eu }
    secrets: inherit
