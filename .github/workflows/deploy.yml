name: Deploy

# Merge to main: deploy to dev (B2B Core Steps Test Tenant), then after approval to sbx
# (amato-rosato-sbx-demo), then after a second approval to prod (Vodafone-CIAM-POC, EU).
# The same commit goes through every stage.
on:
  push:
    branches: [main]
    paths: ["journeys/**", "sub-journeys/**", "connections/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    with: { environment: dev, region: dev }
    secrets: inherit
  sbx:
    needs: dev
    uses: ./.github/workflows/_deploy.yml
    with: { environment: sbx, region: sbx }
    secrets: inherit
  prod:
    needs: sbx
    uses: ./.github/workflows/_deploy.yml
    with: { environment: prod, region: eu }
    secrets: inherit
