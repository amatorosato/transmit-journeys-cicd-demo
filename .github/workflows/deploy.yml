name: Deploy (manual fallback)

# Deploys are done by HCP Terraform (see terraform/). This workflow only runs on demand, as a fallback:
# dev (amato-rosato-sbx-demo), then after approval test (telco-demo-tenant, US), then after a second
# approval prod (Vodafone-CIAM-POC, EU). The same commit goes through every stage.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    with: { environment: dev, region: sbx, tenant: amato-rosato-sbx-demo }
    secrets: inherit
  test:
    needs: dev
    uses: ./.github/workflows/_deploy.yml
    with: { environment: test, region: us, tenant: telco-demo-tenant }
    secrets: inherit
  prod:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with: { environment: prod, region: eu, tenant: Vodafone-CIAM-POC }
    secrets: inherit
