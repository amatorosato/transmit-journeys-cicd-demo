name: Capture from dev

# Designers edit journeys in the dev console; this brings their work into Git as a pull request.
# Exports the dev tenant, updates journeys/ (journeys already in Git + the ones named + the ones with the
# prefix) and connections/ (external connections already in Git + the ones named + the ones the journeys use),
# opens a PR and starts its "validate" check. From there: review, merge, approvals, promotion.
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Journeys to capture, by name (as in the console) or id, comma separated (optional)"
        required: false
        default: ""
      prefix:
        description: "Also capture every journey whose name or id starts with"
        required: false
        default: "CICD-"
      connections:
        description: "Extra external connections, by name or id, comma separated (the ones the journeys use come automatically)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    environment: dev
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: sbx
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Export dev tenant
        run: bash scripts/tsvm.sh export dev.zip
      - name: Update journeys/ and connections/ from the export
        run: |
          python3 scripts/capture.py dev.zip --journeys "${{ inputs.journeys }}" --prefix "${{ inputs.prefix }}" \
            --connections "${{ inputs.connections }}" --notes "$RUNNER_TEMP/notes.md" --summary "$RUNNER_TEMP/summary.md"
          echo; cat "$RUNNER_TEMP/summary.md"
      - name: Open a pull request
        run: |
          rm -f dev.zip
          if [ -z "$(git status --porcelain journeys connections)" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Capture from dev::No changes: everything in Git matches the dev tenant."; exit 0
          fi
          BRANCH="capture/dev-${{ github.run_id }}"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add journeys
          [ -d connections ] && git add connections   # the folder exists only once a connection is captured
          # names as in the console: journey name, connection name (connection files are named by id)
          CHANGED=$(git diff --cached --name-only | python3 -c '
          import sys, yaml
          out = []
          for p in sys.stdin.read().split():
              d = yaml.safe_load(open(p)) or {}
              out.append(d.get("name") or (d.get("data") or {}).get("name") or p.rsplit("/", 1)[-1][:-5])
          print(", ".join(out))')
          git commit -q -m "Capture from dev: $CHANGED"
          git push -q origin "$BRANCH"
          python3 - "$BRANCH" "$CHANGED" "${{ github.actor }}" "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/notes.md" > pr.json <<'EOF'
          import json, os, sys
          b, changed, actor, summary, notes = sys.argv[1:]
          body = f"Captured from the dev tenant console by @{actor}.\n\n" + open(summary).read()
          if os.path.exists(notes) and os.path.getsize(notes):
              body += "\n" + open(notes).read()
          body += ("\n### Next steps\n\n1. Review the changes (Files changed) and wait for the checks: `validate` and the "
                   "Terraform plan of each tenant.\n2. Merge: the dev tenant applies by itself.\n3. In HCP Terraform, "
                   "**Confirm & apply** on `transmit-test`, then on `transmit-prod`.\n")
          print(json.dumps({"title": f"Capture from dev: {changed}", "head": b, "base": "main", "body": body}))
          EOF
          URL=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pulls" --data @pr.json \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["html_url"])')
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows: start the check explicitly
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pr.yml/dispatches" \
            -d "{\"ref\": \"$BRANCH\"}"
          {
            cat "$RUNNER_TEMP/summary.md"
            [ -s "$RUNNER_TEMP/notes.md" ] && { echo; cat "$RUNNER_TEMP/notes.md"; }
            echo
            echo "### Pull request: $URL"
            echo
            echo "Review it and merge it: the dev tenant applies by itself, then **Confirm & apply** on \`transmit-test\` and \`transmit-prod\` in HCP Terraform."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Capture from dev found changes::$(cat "$RUNNER_TEMP/summary.md.headline"). Pull request: $URL"
