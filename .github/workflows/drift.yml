name: Drift check

# Nightly (and on demand): export the test and prod tenants and compare the journeys with Git (test: main,
# prod: the prod branch, which the prod tenant follows).
# The dev tenant is left out on purpose: designers work there (Capture from dev).
# Git always wins: when a tenant differs (edited in the console, or the latest version not applied), the
# check opens a restore pull request (branch restore/<stage>-tenant, updated while open). It only changes
# terraform/restore/<stage>; once merged, HCP Terraform deploys the Git version again on that tenant only,
# after Confirm & apply. The other workspaces plan "no changes".
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# Uses the "<env>-readonly" environments: same tenant, no approval, so the check never waits.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    name: Drift on ${{ matrix.stage }} tenant
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push the restore/<stage>-tenant branch
      pull-requests: write   # open the restore pull request
      actions: write         # start its "validate" check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: test, environment: test-readonly, region: us, branch: main }
          - { stage: prod, environment: prod-readonly, region: eu, branch: prod }
    environment: ${{ matrix.environment }}
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: ${{ matrix.region }}
      TS_STAGE: ${{ matrix.stage }}
      DRIFT_REPORT: drift-report.md   # in the workspace, never committed
      BASE_BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}   # the prod tenant follows the prod branch
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Export tenant
        run: bash scripts/tsvm.sh export "$RUNNER_TEMP/live.zip"
      - name: Compare with Git
        run: python3 scripts/drift.py "$RUNNER_TEMP/live.zip"
      - name: Open the restore pull request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$DRIFT_REPORT" ] || { echo "No differences found: no pull request."; exit 0; }
          BRANCH="restore/$TS_STAGE-tenant"
          NAMES=$(sed -n 's/^#### //p' "$DRIFT_REPORT" | sed 's/ (.*//' | paste -sd, - | sed 's/,/, /g')
          date -u +%Y-%m-%dT%H:%M:%SZ > "terraform/restore/$TS_STAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add "terraform/restore/$TS_STAGE"
          git commit -q -m "Restore the Git version on the $TS_STAGE tenant ($NAMES)"
          git push -q -f origin "$BRANCH"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - "$TS_STAGE" "$NAMES" "$RUN" "$BRANCH" "$DRIFT_REPORT" > pr.json <<'PY'
          import json, os, sys
          stage, names, run, branch, report = sys.argv[1:]
          body = (f"The [drift check]({run}) found journeys on the **{stage} tenant** that differ from Git: "
                  f"{names}. They were edited in the console, or the latest version is not applied there yet.\n\n"
                  f"**Git always wins.** This pull request only changes `terraform/restore/{stage}`. Once merged:\n"
                  f"- `transmit-{stage}` plans `terraform_data.deploy must be replaced`: **Confirm & apply**, and "
                  f"the Git version is back on the {stage} tenant;\n"
                  f"- the other workspaces plan *no changes*.\n\n"
                  f"While this pull request is open, the nightly drift check updates it instead of opening a new one.\n\n"
                  f"### What differs on the {stage} tenant (- Git, + {stage} tenant)\n\n" + open(report).read())
          print(json.dumps({"title": f"Restore the Git version on the {stage} tenant ({names})",
                            "head": branch, "base": os.environ["BASE_BRANCH"], "body": body[:60000]}))
          PY
          API="https://api.github.com/repos/${{ github.repository }}"
          OPEN=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                 "$API/pulls?state=open&head=${{ github.repository_owner }}:$BRANCH" \
                 | python3 -c 'import sys,json;p=json.load(sys.stdin);print(p[0]["number"] if p else "")')
          if [ -n "$OPEN" ]; then
            # keep title and description in step with what the tenant shows now
            curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" "$API/pulls/$OPEN" --data @pr.json >/dev/null
            URL="${{ github.server_url }}/${{ github.repository }}/pull/$OPEN"
            MSG="Restore pull request updated: $URL"
          else
            URL=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/pulls" --data @pr.json \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin)["html_url"])')
            MSG="Restore pull request opened: $URL"
          fi
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows: start the check explicitly
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/actions/workflows/pr.yml/dispatches" \
            -d "{\"ref\": \"$BRANCH\"}"
          echo "::error title=Restore the $TS_STAGE tenant::$MSG. Merge it, then Confirm & apply in transmit-$TS_STAGE."
          echo "### $MSG" >> "$GITHUB_STEP_SUMMARY"
