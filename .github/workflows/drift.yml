name: Drift check

# Nightly (and on demand): export the test and prod tenants and compare the journeys with Git.
# The dev tenant is left out on purpose: designers work there (Capture from dev).
# Git always wins: when a tenant differs (edited in the console, or the latest version not applied), the
# check queues a restore run in its HCP Terraform workspace (transmit-test / transmit-prod). The run forces
# the deploy of the Git version and waits for Confirm & apply, like every other change.
# Needs the repository secret TF_API_TOKEN (HCP Terraform API token).
# Uses the "<env>-readonly" environments: same tenant, no approval, so the check never waits.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift on ${{ matrix.stage }} tenant
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: test, environment: test-readonly, region: us }
          - { stage: prod, environment: prod-readonly, region: eu }
    environment: ${{ matrix.environment }}
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: ${{ matrix.region }}
      TS_STAGE: ${{ matrix.stage }}
      TFC_ORG: amato-transmit-demo
    steps:
      - uses: actions/checkout@v6
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Export tenant
        run: bash scripts/tsvm.sh export "$RUNNER_TEMP/live.zip"
      - name: Compare with Git
        run: python3 scripts/drift.py "$RUNNER_TEMP/live.zip"
      - name: Queue a restore run in HCP Terraform
        if: failure()
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          WS_NAME="transmit-$TS_STAGE"
          UI="https://app.terraform.io/app/$TFC_ORG/workspaces/$WS_NAME/runs"
          if [ -z "$TF_API_TOKEN" ]; then
            echo "::error title=TF_API_TOKEN not set::Cannot queue the restore run. Add the repository secret TF_API_TOKEN, or in $WS_NAME start a run that replaces terraform_data.deploy."
            exit 1
          fi
          API="https://app.terraform.io/api/v2"
          H="Authorization: Bearer $TF_API_TOKEN"
          WS=$(curl -sf -H "$H" "$API/organizations/$TFC_ORG/workspaces/$WS_NAME" \
               | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])')
          # a run already waiting (e.g. the latest merge, or last night's restore): confirm that one
          WAITING=$(curl -sf -H "$H" "$API/workspaces/$WS/runs?page%5Bsize%5D=20" | python3 -c '
          import sys, json
          active = {"pending", "fetching", "fetching_completed", "pre_plan_running", "pre_plan_completed", "queuing",
                    "plan_queued", "planning", "planned", "cost_estimating", "cost_estimated", "policy_checking",
                    "policy_override", "policy_soft_failed", "policy_checked", "confirmed", "post_plan_running",
                    "post_plan_completed", "apply_queued", "applying"}
          runs = [r["id"] for r in json.load(sys.stdin)["data"] if r["attributes"]["status"] in active]
          print(runs[0] if runs else "")')
          if [ -n "$WAITING" ]; then
            MSG="A run is already waiting in $WS_NAME: Confirm & apply it to put the Git version back: $UI/$WAITING"
          else
            python3 - "$WS" "$TS_STAGE" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > run.json <<'PY'
          import json, sys
          ws, stage, link = sys.argv[1:]
          print(json.dumps({"data": {"type": "runs",
              "attributes": {"message": f"Restore the Git version on the {stage} tenant (drift check {link})",
                             "replace-addrs": ["terraform_data.deploy"]},
              "relationships": {"workspace": {"data": {"type": "workspaces", "id": ws}}}}}))
          PY
            RUN=$(curl -sf -X POST -H "$H" -H "Content-Type: application/vnd.api+json" "$API/runs" --data @run.json \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])')
            MSG="Restore run queued in $WS_NAME: Confirm & apply it to put the Git version back: $UI/$RUN"
          fi
          echo "::error title=Confirm the restore in $WS_NAME::$MSG"
          echo "### $MSG" >> "$GITHUB_STEP_SUMMARY"
