name: Drift check

# Nightly (and on demand): export test and prod and compare the journeys with Git.
# dev is left out on purpose: designers work there, differences are work in progress (Capture from dev).
# Uses the "<env>-readonly" environments: same tenant, no approval, so the check never waits.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { environment: test-readonly, region: us }
          - { environment: prod-readonly, region: eu }
    environment: ${{ matrix.environment }}
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Export tenant
        run: bash scripts/tsvm.sh export live.zip
      - name: Compare with Git
        run: python3 scripts/drift.py live.zip
