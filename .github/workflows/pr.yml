name: PR check

# Every pull request: build the package, run the safety guard, validate it on the dev tenant.
# Nothing is imported. Mark "validate" as a required status check on main.
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    # the DEV tenant only accepts the corporate network: self-hosted runner
    runs-on: [self-hosted, transmit-dev]
    environment: dev
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: dev
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Build package
        run: bash scripts/tsvm.sh build package.zip
      - name: Safety guard
        run: python3 scripts/guard.py package.zip
      - name: Validate on dev tenant
        run: bash scripts/tsvm.sh validate package.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.event.pull_request.number }}
          path: package.zip
