name: PR check

# Every pull request: build the package, run the safety guard, validate it on dev (amato-rosato-sbx-demo).
# Nothing is imported. Mark "validate" as a required status check on main.
# workflow_dispatch: started by "Capture from dev" on its branch (PRs opened by GITHUB_TOKEN do not
# trigger pull_request workflows), so the captured PR gets its "validate" check too.
on:
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    environment: dev
    env:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TS_TENANT_ID: ${{ secrets.TS_TENANT_ID }}
      TS_REGION: sbx
      TS_STAGE: dev
    steps:
      - uses: actions/checkout@v6
      - run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: Build package
        run: bash scripts/tsvm.sh build package.zip
      - name: Safety guard
        run: python3 scripts/guard.py package.zip
      - name: Validate on dev tenant
        run: bash scripts/tsvm.sh validate package.zip
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ github.event.pull_request.number || github.run_id }}
          path: package.zip
